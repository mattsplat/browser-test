# Phase 0 shell. Started from Blitz's reference browser (apps/browser, MIT/Apache-2.0,
# see LICENSE-*), with every network request routed through `gate::Gate`.
[package]
name = "unscripted"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "unscripted"
path = "src/main.rs"

[features]
default = ["hybrid", "cookies", "cache", "screenshot", "apple-font-embolden", "scrollbars", "mimalloc"]

screenshot = ["dep:blitz-paint", "dep:rfd"]
capture = ["dep:anyrender_serialize", "dep:blitz-paint", "dep:rfd"]
vello = ["dioxus-native/vello"]
hybrid = ["dioxus-native/vello-hybrid"]
cpu = ["dioxus-native/vello-cpu-pixels"]
log-times = ["dioxus-native/log-frame-times", "dioxus-native/log-phase-times"]
cache = ["blitz-net/cache"]
cookies = ["blitz-net/cookies"]
tracing = ["dioxus-native/tracing", "blitz-html/tracing", "blitz-net/tracing", "blitz-paint?/tracing", "dep:tracing-subscriber"]
scrollbars = ["blitz-dom/scrollbars", "blitz-paint/scrollbars"]
mimalloc = ["dep:mimalloc"]
apple-font-embolden = ["dioxus-native/apple-font-embolden"]

[dependencies]
dioxus-native = { path = "../vendor/blitz/packages/dioxus-native", default-features = false, features = [
  "svg",
  "system-fonts",
  "net",
  "prelude",
  "hot-reload"
] }
blitz-traits = { path = "../vendor/blitz/packages/blitz-traits", default-features = false }
blitz-dom = { path = "../vendor/blitz/packages/blitz-dom", features = ["woff", "parallel-construct", "floats", "text-transform-icu"] }
blitz-net = { path = "../vendor/blitz/packages/blitz-net", default-features = false, features = ["http2", "cookies"] }
blitz-html = { path = "../vendor/blitz/packages/blitz-html", default-features = false }
blitz-paint = { path = "../vendor/blitz/packages/blitz-paint", default-features = false, optional = true }
browser-persistence = { path = "persistence" }
linebender_resource_handle = "0.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", optional = true }
webbrowser = "1.0"
winit = "=0.31.0-beta.4"
image = { version = "0.25.6", default-features = false, features = ["ico"] }
usvg = "0.48.1"
nucleo = "0.5"
anyrender = "0.14.0"
anyrender_serialize = { version = "0.8.0", optional = true }
# Canvas 2D rasterises with these too, so they're always built (they were the screenshot
# feature's, which is on by default).
anyrender_vello_cpu = "0.18.0"
png = "0.18"
peniko = "0.6.0"
tokio = { version = "1.42", features = ["time", "rt", "sync", "macros"] }
mimalloc = { version = "0.1.48", optional = true }
rfd = { version = "0.17.1", default-features = false, features = ["xdg-portal"], optional = true }

# Phase 1: the Dart language pack
wasmtime = "50"
anyhow = "1"
regex = "1"

# Step 3: settings and dev mode
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"

# Step 6: third-party checks use registrable domains
psl = "2"
url = "2"
keyboard-types = "0.8"

# Phase E: compiled-code cache keys (already in the dependency tree)
sha2 = "0.10"

# Web platform parity: the cookie jar shared with the network stack (already in the
# dependency tree, through reqwest)
cookie_store = "0.22"
cookie = "0.18"

# Web platform parity part 2: WebSocket connections (both already in the dependency tree:
# tungstenite through Dioxus's devtools, native-tls through reqwest)
tungstenite = "0.29"
native-tls = "0.2"
# Canvas text (already in the dependency tree, through Blitz)
parley = "0.12"

# Blitz's GPU renderer never frees cached images, so a canvas animation (a new image every
# frame) fills its atlas and panics within seconds. Our copy frees images a frame didn't
# draw; see vendor/anyrender_vello_hybrid (search "browser-test").
[patch.crates-io]
anyrender_vello_hybrid = { path = "../vendor/anyrender_vello_hybrid" }
