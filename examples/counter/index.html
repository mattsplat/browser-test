<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dart counter</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    #status { color: #2E7D32; }
    .counter { display: flex; align-items: center; gap: 16px; margin: 24px 0; }
    #count { font-size: 48px; font-weight: bold; min-width: 64px; }
    button { font-size: 16px; padding: 8px 16px; border: 1px solid #888; border-radius: 6px; background: #f4f4f4; }
    button:hover { background: #e8e8e8; }
    #log { color: #555; }
  </style>
</head>
<body>
  <h1>Dart counter</h1>
  <p id="status">Dart has not started.</p>
  <div class="counter">
    <span id="count">0</span>
    <button id="increment">Add one</button>
  </div>
  <ul id="log"></ul>
  <script type="application/dart" src="main.wasm"></script>
</body>
</html>
