<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Python to-do</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    #text { flex: 1; font-size: 16px; padding: 6px 10px; border: 1px solid #aaa; border-radius: 6px; }
    button { font-size: 14px; padding: 6px 12px; border: 1px solid #888; border-radius: 6px; background: #f4f4f4; }
    button.on { background: #222; color: #fff; }
    #items { list-style: none; padding: 0; }
    #items li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #eee; }
    #items li span { flex: 1; }
    #items li.done span { text-decoration: line-through; color: #999; }
    .delete { border: none; background: none; color: #c00; font-size: 18px; }
    .footer { display: flex; align-items: center; gap: 8px; color: #555; }
    #left { flex: 1; }
  </style>
</head>
<body>
  <h1>Python to-do</h1>
  <p>Forms, events and <code>localStorage</code> in Python: the list survives a reload. The
  code is <code>main.py</code>.</p>
  <form id="new">
    <input id="text" placeholder="What needs doing?">
    <button type="submit">Add</button>
  </form>
  <ul id="items"></ul>
  <div class="footer">
    <span id="left">Python isn't running on this page.</span>
    <button class="filter on" data-filter="all">All</button>
    <button class="filter" data-filter="active">Active</button>
    <button class="filter" data-filter="done">Done</button>
    <button id="clear-done">Clear done</button>
  </div>
  <script type="text/python" src="main.py"></script>
</body>
</html>
