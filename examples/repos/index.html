<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PHP repo browser</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    #who { flex: 1; font-size: 16px; padding: 6px 10px; border: 1px solid #aaa; border-radius: 6px; }
    button { font-size: 14px; padding: 6px 12px; border: 1px solid #888; border-radius: 6px; background: #f4f4f4; }
    #status { color: #555; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #ccc; color: #1565C0; }
    td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .description { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>PHP repo browser</h1>
  <p>Public repositories from the GitHub API, fetched through the browser's gate and shown as a
  table you can sort by clicking a heading. In PHP; the code is <code>main.php</code>.</p>
  <form id="search">
    <input id="who" value="DioxusLabs">
    <button type="submit">Load</button>
  </form>
  <p id="status">PHP isn't running on this page.</p>
  <table>
    <thead><tr>
      <th data-key="name">Name</th>
      <th data-key="language">Language</th>
      <th data-key="stars">Stars</th>
      <th data-key="forks">Forks</th>
      <th data-key="updated">Updated</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script type="text/php" src="main.php"></script>
</body>
</html>
